[package]
name = "reader_rs"
version = "0.1.0"
edition = "2021"
description = "Reader：Agent 原生文档阅读、搜索和提取工具"
license = "MIT"
repository = "https://github.com/raystyle/reader_rs"

[[bin]]
name = "reader"
path = "src/main.rs"

[[bin]]
name = "rr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# 选型见 docs\research\S001：firecrawl/pdf-inspector，纯 Rust 默认构建（lopdf 解析），MIT，活跃维护
pdf-inspector = "1"
# XHTML 文本化（EPUB 章正文），事件流最小解；0.42 起实体报为 GeneralRef 事件
quick-xml = "0.42.0"
# 选型见 docs\research\S003：rbook 读 EPUB 容器与 spine 序（Apache-2.0；epub crate 为 GPL 出局）
rbook = "0.7.10"
regex = "1"
# JSON 包膜与 filter 点路径（P0006）：序列化事实标准，选型记 P0006 方案 1 条
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件（R002 选型：
# crates.io 稳定主流、持续维护），只进测试构建。
assert_cmd = "2"
predicates = "3"
# 测试用 PDF 由 lopdf 现造（已是 pdf-inspector 传递依赖，锁定同族版本）
lopdf = "0.44"
