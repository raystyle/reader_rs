[package]
name = "reader_rs"
version = "0.3.0"
edition = "2021"
description = "Reader：Agent 原生文档阅读、搜索和提取工具"
license = "MIT"
repository = "https://github.com/raystyle/reader_rs"

[[bin]]
name = "reader"
path = "src/main.rs"

[[bin]]
name = "rr"
path = "src/main.rs"

[dependencies]
anydoc = "0.2.4"
clap = { version = "4", features = ["derive"] }
# PDF 提取引擎：firecrawl/pdf-inspector，纯 Rust 默认构建（lopdf 解析），MIT（S001）。
# PDF 保持直连保页契约（页级单元与 needs_ocr）；anydoc 对 PDF 也直连它，架构同构（P0009）
pdf-inspector = "1"
regex = "1"
# JSON 包膜与 filter 点路径（P0006）：序列化事实标准，选型记 P0006 方案 1 条
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OCR 兜底管线（P0014，P0018 换引擎）：hayro 渲染 needs_ocr 页为位图，
# ppocr-rs 原生 CPU 内核跑 PP-OCRv6 tiny（S008 裁决双优；git rev 钉死，未上 crates.io）
hayro = "0.7"
ppocr-rs = { git = "https://github.com/weidix/ppocr-rs", rev = "d07857c35457f90bb8df92e245f614cdc3d5e236" }
# 模型首用下载与 self update（P0015）：纯 Rust 加 rustls 默认，守纯 Rust 与 musl 静态边界
ureq = "3"
# self update 资产 SHA-256 钉死校验（P0015）
sha2 = "0.10"
# hayro 位图到引擎的内存传递
image = "0.25"
# mq 结构化提取引擎（P0016，选型 S007）：jq 风格 markdown 查询，MIT 纯 Rust
mq-lang = "0.8"

[target.'cfg(unix)'.dependencies]
# SIGPIPE 恢复默认处置用（M007）：管道读者早退（`reader … | head`）按 Unix 惯例
# 静默终止，不 panic；已是 anydoc 家族传递依赖，此处升为直接依赖
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# self update 解 zip 资产（P0015；release.yml Windows 打包形态）
zip = "8.6"

[target.'cfg(not(windows))'.dependencies]
# self update 解 tar.gz 资产（P0015；flate2 1.x 默认 rust_backend 走 miniz_oxide，纯 Rust 不破边界）
tar = "0.4"
flate2 = "1"

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件（R002 选型：
# crates.io 稳定主流、持续维护），只进测试构建。
assert_cmd = "2"
predicates = "3"
# 测试用 PDF 由 lopdf 现造（已是 pdf-inspector 传递依赖，锁定同族版本）
lopdf = "0.44"
# 验收层解析 JSON 包膜、回归层核 external 样本 sha256（D31 第 2 轮：三层归 cargo 体系）
serde_json = "1"
sha2 = "0.10"
# 验收层 BDD（D33）：cucumber Gherkin 场景驱动；futures 提供 block_on 执行器
cucumber = "0.23"
futures = "0.3"
# 测试用 EPUB 由 rbook builder 现造（P0009 起 rbook 退出主依赖，转测试侧造夹具；选型记 S003）
rbook = "0.7.10"
# 测试用 docx 由 zip 现造最小 OOXML（P0009；anydoc 家族夹具）
zip = "8.6"

# 验收层 cucumber 自管输出与退出码（D33；须在 dev-dependencies 之后，TOML 节序）
[[test]]
name = "accept"
path = "tests/accept.rs"
harness = false
