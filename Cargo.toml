[package]
name = "reader_rs"
version = "0.3.0"
edition = "2021"
description = "Reader：Agent 原生文档阅读、搜索和提取工具"
license = "MIT"
repository = "https://github.com/raystyle/reader_rs"

[[bin]]
name = "reader"
path = "src/main.rs"

[[bin]]
name = "rr"
path = "src/main.rs"

[dependencies]
anydoc = "0.2.4"
clap = { version = "4", features = ["derive"] }
# PDF 提取引擎：firecrawl/pdf-inspector，纯 Rust 默认构建（lopdf 解析），MIT（S001）。
# PDF 保持直连保页契约（页级单元与 needs_ocr）；anydoc 对 PDF 也直连它，架构同构（P0009）
pdf-inspector = "1"
regex = "1"
# JSON 包膜与 filter 点路径（P0006）：序列化事实标准，选型记 P0006 方案 1 条
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OCR 兜底管线（P0014，选型 S006）：hayro 渲染 needs_ocr 页为位图，
# pure-onnx-ocr（vendor 修 max_width 320 硬编码，S006 踩坑 2）跑 PP-OCRv5 mobile
hayro = "0.7"
pure-onnx-ocr = "0.1"
# 运行时 strip ONNX value_info（S006 踩坑 1）：用 tract-onnx 的 prost 生成类型改写 pb
tract-onnx = "0.20"
prost = "0.11"
# 模型首用下载（S006 关键结论 5）：纯 Rust 加 rustls 默认，守纯 Rust 与 musl 静态边界
ureq = "3"
# 模型件 SHA-256 钉死校验（S006 关键结论 5）
sha2 = "0.10"
# hayro 位图到引擎的内存传递（与 pure-onnx-ocr 同族 0.25）
image = "0.25"
# mq 结构化提取引擎（P0016，选型 S007）：jq 风格 markdown 查询，MIT 纯 Rust
mq-lang = "0.8"

[patch.crates-io]
pure-onnx-ocr = { path = "vendor/pure-onnx-ocr" }

[target.'cfg(unix)'.dependencies]
# SIGPIPE 恢复默认处置用（M007）：管道读者早退（`reader … | head`）按 Unix 惯例
# 静默终止，不 panic；已是 anydoc 家族传递依赖，此处升为直接依赖
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# self update 解 zip 资产（P0015；release.yml Windows 打包形态）
zip = "8.6"

[target.'cfg(not(windows))'.dependencies]
# self update 解 tar.gz 资产（P0015；flate2 1.x 默认 rust_backend 走 miniz_oxide，纯 Rust 不破边界）
tar = "0.4"
flate2 = "1"

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件（R002 选型：
# crates.io 稳定主流、持续维护），只进测试构建。
assert_cmd = "2"
predicates = "3"
# 测试用 PDF 由 lopdf 现造（已是 pdf-inspector 传递依赖，锁定同族版本）
lopdf = "0.44"
# 测试用 EPUB 由 rbook builder 现造（P0009 起 rbook 退出主依赖，转测试侧造夹具；选型记 S003）
rbook = "0.7.10"
# 测试用 docx 由 zip 现造最小 OOXML（P0009；anydoc 家族夹具）
zip = "8.6"
