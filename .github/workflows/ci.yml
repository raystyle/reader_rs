name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

jobs:
  gates:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 私有 git 依赖（ledger-rs 等）拉取凭据：token 走仓库 secret（站侧自灌，
      # 值不经对话）；空则跳过（无私有 git 依赖时无需此步）
      - name: 私有 git 依赖凭据
        shell: bash
        env:
          PRIVATE_GIT_TOKEN: ${{ secrets.PRIVATE_GIT_TOKEN }}
        run: |
          if [ -n "$PRIVATE_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
