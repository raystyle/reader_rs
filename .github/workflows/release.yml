name: Release

on:
  push:
    tags: ['v*']
  # 手动演练镜像腿(D42):对历史 tag 补跑资产上桶(如 v0.4.0);build 矩阵只在 push 跑
  workflow_dispatch:
    inputs:
      tag:
        description: '要镜像的 release tag(如 v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # musl 静态资产(P0013):Alpine / 容器 / 最小镜像场景;musl-tools 供 zstd-sys 等 C 编译
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel mac 在 ARM runner 上交叉编译(同 Xcode SDK 双架构);macos-13 Intel runner 已退役无容量
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 装 musl 工具链
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # 私有 git 依赖（ledger-rs 等）拉取凭据：token 走仓库 secret（站侧自灌，
      # 值不经对话）；空则跳过（无私有 git 依赖时无需此步）
      - name: 私有 git 依赖凭据
        shell: bash
        env:
          PRIVATE_GIT_TOKEN: ${{ secrets.PRIVATE_GIT_TOKEN }}
        run: |
          if [ -n "$PRIVATE_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${PRIVATE_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: bash
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 打包 zip(Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "reader-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\reader.exe", "target\${{ matrix.target }}\release\rr.exe", README.md, LICENSE $stage
          Compress-Archive $stage "$stage.zip"
          # 边车 LF 落盘(sha256sum 原生格式;Out-File 默认 CRLF,消费侧剥 \r 属历史兼容,正源改单行 LF)
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/$stage.zip.sha256", "$hash  $stage.zip`n")
      - name: 打包 tar.gz(macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="reader-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/reader" "target/${{ matrix.target }}/release/rr" README.md LICENSE "$stage"/
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
      - name: 解包冒烟(Windows zip,原生 msvc 跑 --version 对 tag)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "reader-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          $smoke = "$env:RUNNER_TEMP\smoke"
          Expand-Archive "$stage.zip" -DestinationPath $smoke -Force
          $out = & "$smoke\$stage\reader.exe" --version
          $expected = "reader $($env:GITHUB_REF_NAME.Substring(1))"
          if ($out -ne $expected) { Write-Host "::error::解包冒烟不过 '$out' != '$expected'"; exit 1 }
          Write-Host "解包冒烟过: $out"
      - name: 解包冒烟(macOS / Linux tar.gz;Intel mac 交叉件按 Rosetta 在否降级 file 判形)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="reader-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$stage.tar.gz" -C "$RUNNER_TEMP/smoke"
          bin="$RUNNER_TEMP/smoke/$stage/reader"
          expected="reader ${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              bin="arch -x86_64 $bin"
            else
              # Intel runner 已退役(M004),Rosetta 缺席时按 R005 口径以 file 判形为准
              echo "::warning::Rosetta 缺席,x86_64 冒烟降级 file 判形"
              file "$bin" | grep -q "x86_64" || { echo "::error::file 判形不过"; exit 1; }
              echo "file 判形过: $(file "$bin")"
              exit 0
            fi
          fi
          out="$($bin --version)"
          if [ "$out" != "$expected" ]; then echo "::error::解包冒烟不过 '$out' != '$expected'"; exit 1; fi
          echo "解包冒烟过: $out"
      - name: 上传 release 资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --latest 直发钉回(禁 draft;五 job 竞态下首个 create,其余容忍已存在;末尾 mirror 的 edit --latest 双保险保留)
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --latest || true
          gh release upload "${GITHUB_REF_NAME}" "reader-${GITHUB_REF_NAME}-${{ matrix.target }}."* --clobber

  # 镜像腿(D42):release 资产与 .sha256 边车上 R2 桶 reader/<version>/(immutable 头),
  # latest.json 最后传(max-age=60;清单即发布提交点);末尾把本 tag 钉回 /releases/latest
  # 双保险(防其它正式 release 遮蔽 self update 判新)。checkout 保持默认语义:push 检出
  # tag 树,dispatch 检出默认分支(演练历史 tag 时新脚本不在该 tag 树里,tag 只作参数)。
  mirror:
    needs: build
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # 桶级 token 无建桶权,禁 HeadBucket 预检(否则 403,M015;隔离目录 copy 手法并存)
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 装 rclone(钉 1.75.0)
        run: |
          curl -fsSL -o rclone.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          unzip -q rclone.zip
          sudo install rclone-v1.75.0-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1
      - name: 取 release 元数据与资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RUNNER_TEMP/release.json"
          mkdir "$RUNNER_TEMP/dist"
          gh release download "$TAG" --dir "$RUNNER_TEMP/dist" --pattern 'reader-*'
          ls "$RUNNER_TEMP/dist"
      - name: 生成 latest.json(边车 sha256 优先,五平台白名单校验)
        run: |
          uv run --script .tools/gen-latest-json.py \
            --release "$RUNNER_TEMP/release.json" \
            --assets-dir "$RUNNER_TEMP/dist" \
            --out "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"
      - name: 资产上桶(immutable;首跑凭据传播延迟 401 重试勿判死)
        run: |
          version="${TAG#v}"
          # --ignore-times 强制重传:存量同内容覆盖 PUT 会丢 --header-upload 头(D42 在册坑族第三例,
          # 2026-09-17 演练实证;同修法见 mirror-models.py upload.sh)
          for i in 1 2 3; do
            if rclone copy -v --ignore-times "$RUNNER_TEMP/dist" "R2:reader-dl/reader/${version}" \
                 --header-upload "Cache-Control: public, max-age=31536000, immutable"; then
              ok=1; break
            fi
            echo "第 ${i} 次上桶失败(新 token 的 S3 凭据映射有 1 至 2 分钟传播延迟);60 秒后重试"
            sleep 60
          done
          [ "${ok:-0}" = 1 ] || exit 1
      - name: latest.json 最后传(max-age=60)
        run: |
          # 单件不走 copyto:rclone 对 R2 的 copyto 触发 HeadBucket 加 CreateBucket,桶级 token 403(实测)
          # --ignore-times 强制重传:同内容覆盖 PUT 会丢 --header-upload 头(2026-09-17 演练实证)
          mkdir "$RUNNER_TEMP/latest-only"
          mv "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/latest-only/"
          rclone copy -v --ignore-times "$RUNNER_TEMP/latest-only" "R2:reader-dl/reader" \
            --header-upload "Cache-Control: public, max-age=60"
      - name: 清点报数与零上传红灯
        run: |
          version="${TAG#v}"
          n_dist=$(ls -1 "$RUNNER_TEMP/dist" | wc -l)
          n_r2=$(rclone lsf "R2:reader-dl/reader/${version}" | wc -l)
          echo "版本段对象 r2=${n_r2} / dist=${n_dist}(五包加边车)"
          [ "${n_r2}" -ge 1 ] || { echo "::error::版本段零对象(半失败红灯)"; exit 1; }
          diff <(ls -1 "$RUNNER_TEMP/dist" | sort) <(rclone lsf "R2:reader-dl/reader/${version}" | sort) \
            || { echo "::error::版本段对象清单与 dist 不等(半失败红灯)"; exit 1; }
          sleep 5
          curl -fsSI "https://reader.ohmygh.com/reader/latest.json" | grep -i 'cache-control.*max-age=60' \
            || { echo "::error::latest.json 头抽验不过"; exit 1; }
          echo "零上传红灯过:版本段 ${n_r2} 件全等,latest.json 头在位"
      - name: 本 tag 钉回 latest(防遮蔽双保险)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --latest
